# AIOps平台 Nginx配置示例
# 将 frontend-dist 目录部署为静态站点，/api 反向代理到后端8080
#
# 使用方法：
#   1. 将本文件放入 nginx 的 conf.d/ 目录（或 nginx.conf 的 http{} 中）
#   2. 修改 server_name 为本机IP或域名
#   3. nginx -t 检查配置，systemctl reload nginx 生效
#
# 注意：root 直接指向部署包里的 frontend-dist（无 dist 子目录），
#       与 update.sh 的更新路径一致，日后升级前端无需再改nginx。

# 后端上游定义: 长连接复用 + 自动探活, 防止502
upstream aiops_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;                          # 改成你的域名或IP，_ 表示匹配所有

    # 前端静态文件（绝对路径，按实际解压位置修改）
    root /opt/aiops-deploy/frontend-dist;
    index index.html;

    # 允许上传较大的文件（如Excel导入、Agent包下载）
    client_max_body_size 50m;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端API反向代理
    location /api/ {
        proxy_pass http://aiops_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";            # 清除Connection头以启用长连接

        # 超时设置: 防止后端忙时502
        proxy_connect_timeout 10s;                 # 连接后端超时10秒
        proxy_send_timeout 120s;                   # 发送请求体超时
        proxy_read_timeout 120s;                   # AI对话可能较慢

        # 后端不可达时自动重试, 避免直接返回502
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
