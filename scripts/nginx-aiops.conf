# AIOps平台 Nginx配置示例
# 将 frontend-dist 目录部署为静态站点，/api 反向代理到后端8080
#
# 使用方法：
#   1. 将本文件放入 nginx 的 conf.d/ 目录（或 nginx.conf 的 http{} 中）
#   2. 修改 server_name 为本机IP或域名
#   3. nginx -t 检查配置，systemctl reload nginx 生效
#
# 注意：root 直接指向部署包里的 frontend-dist（无 dist 子目录），
#       与 update.sh 的更新路径一致，日后升级前端无需再改nginx。

server {
    listen 80;
    server_name _;                          # 改成你的域名或IP，_ 表示匹配所有

    # 前端静态文件（绝对路径，按实际解压位置修改）
    root /opt/aiops-deploy/frontend-dist;
    index index.html;

    # 允许上传较大的文件（如Excel导入、Agent包下载）
    client_max_body_size 50m;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端API反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # AI对话可能较慢
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
